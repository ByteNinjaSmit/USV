<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f8fafc;
    --color-text-primary: #0f172a;
    --color-text-secondary: #334155;
    --color-text-tertiary: #64748b;
    --color-border-primary: #e2e8f0;
    --color-border-secondary: #cbd5e1;
    --color-border-tertiary: #cbd5e1;
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --pcb: #1B5E20;
    --pcb-edge: #0D3B0D;
    --breadboard: #f5f5f0;
    --bb-rail: #e0e0d8;
    --bb-hole: #ccc;
    --copper: #b87333;
    --wire-label-bg: rgba(255, 255, 255, 0.9);
  }

  svg {
    background-color: var(--color-background-primary);
  }

  .comp-label {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    fill: var(--color-text-secondary);
  }

  .pin-label {
    font-family: var(--font-mono);
    font-size: 9px;
    fill: var(--color-text-tertiary);
  }

  .section-label {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 600;
    fill: var(--color-text-primary);
  }

  .gpio-label {
    font-family: var(--font-mono);
    font-size: 8px;
  }

  .legend-text {
    font-family: var(--font-sans);
    font-size: 11px;
    fill: var(--color-text-secondary);
  }

  .title-text {
    font-family: var(--font-sans);
    font-size: 20px;
    font-weight: 600;
    fill: var(--color-text-primary);
  }

  .subtitle-text {
    font-family: var(--font-sans);
    font-size: 12px;
    fill: var(--color-text-secondary);
  }

  .table-text {
    font-family: var(--font-mono);
    font-size: 10px;
    fill: var(--color-text-secondary);
  }
</style>
<svg width="100%" viewBox="0 0 960 1400" xmlns="http://www.w3.org/2000/svg">

    and buzzer for the AquaBot water surface cleaning robot.</desc>

  <!-- Background grid -->

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">

    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" />
    </marker>
    <filter id="chip-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="960" height="1400" fill="var(--color-background-primary)" />
  <rect width="960" height="1400" fill="url(#grid)" />

  </g>

  <!-- ═══════════════════════════════════════ -->
  <!-- SECTION: ULTRASONIC SENSORS (top) -->
  <!-- ═══════════════════════════════════════ -->
  <text class="section-label" x="65" y="125">Ultrasonic sensors (HC-SR04)</text>

  <!-- Front sensor -->
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="120" height="70" rx="4" fill="#263238" stroke="#546E7A" stroke-width="1" />
    <circle cx="35" cy="35" r="16" fill="#37474F" stroke="#78909C" stroke-width="1" />
